version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: America/Indiana/Indianapolis
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - supply-chain

  - package-ecosystem: docker
    directory: /sensor
    schedule:
      interval: weekly
      day: monday
      time: "09:15"
      timezone: America/Indiana/Indianapolis
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - supply-chain

  - package-ecosystem: uv
    directory: /sensor
    schedule:
      interval: weekly
      day: monday
      time: "09:30"
      timezone: America/Indiana/Indianapolis
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - supply-chain
