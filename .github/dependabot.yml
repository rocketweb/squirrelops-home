version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
      time: "09:00"
      timezone: America/Indiana/Indianapolis
    open-pull-requests-limit: 5
    groups:
      github-actions:
        applies-to: version-updates
        patterns:
          - "*"
      github-actions-security:
        applies-to: security-updates
        patterns:
          - "*"
    labels:
      - dependencies
      - supply-chain

  - package-ecosystem: docker
    directory: /sensor
    schedule:
      interval: monthly
      time: "09:15"
      timezone: America/Indiana/Indianapolis
    open-pull-requests-limit: 5
    # Python stays on 3.11 until the runtime migration tracked in #67, which
    # moves the Docker image and the standalone native Python together.
    # Digest refreshes of 3.11 are still wanted; new minors and majors are not.
    ignore:
      - dependency-name: python
        update-types:
          - version-update:semver-major
          - version-update:semver-minor
    groups:
      sensor-docker:
        applies-to: version-updates
        patterns:
          - "*"
      sensor-docker-security:
        applies-to: security-updates
        patterns:
          - "*"
    labels:
      - dependencies
      - supply-chain

  - package-ecosystem: uv
    directory: /sensor
    schedule:
      interval: monthly
      time: "09:30"
      timezone: America/Indiana/Indianapolis
    open-pull-requests-limit: 5
    groups:
      sensor-python:
        applies-to: version-updates
        patterns:
          - "*"
      sensor-python-security:
        applies-to: security-updates
        patterns:
          - "*"
    labels:
      - dependencies
      - supply-chain
