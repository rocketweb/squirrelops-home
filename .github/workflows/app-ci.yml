name: App CI

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/app-ci.yml"

  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/app-ci.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Build
        run: swift build

      # Keep AppKit rendering and helper subprocess checks from starving the
      # relay's sub-second deadline tests on the shared runner. Every target
      # still runs in full, using the same target boundaries as local acceptance.
      - name: Test app
        run: swift test --filter SquirrelOpsHomeTests

      - name: Test helper
        run: swift test --skip-build --filter SquirrelOpsHelperTests

      - name: Test guest runtime
        run: swift test --skip-build --filter SquirrelOpsDeceptionGuestTests
