name: App CI

on:
  push:
    branches:
      - main
    paths:
      - "app/**"
      - ".github/workflows/app-ci.yml"

  pull_request:
    paths:
      - "app/**"
      - ".github/workflows/app-ci.yml"

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build & Test
    runs-on: macos-15

    defaults:
      run:
        working-directory: app

    steps:
      - name: Checkout repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Build
        # Xcode 16.2's Swift 6.0.3 frontend can crash while batch-lowering the
        # large privileged-helper RPC module. Compile one primary file at a
        # time; this does not change optimization or release behavior.
        run: swift build -Xswiftc -disable-batch-mode

      - name: Test
        run: swift test -Xswiftc -disable-batch-mode
