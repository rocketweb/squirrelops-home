name: Sensor CI

on:
  push:
    branches:
      - main
    paths:
      - "sensor/**"
      - ".github/workflows/sensor-ci.yml"

  pull_request:
    paths:
      - "sensor/**"
      - ".github/workflows/sensor-ci.yml"

permissions:
  contents: read

jobs:
  check:
    name: Lint, Type-check, Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: sensor

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@1c37ad07a6a961277cf70c0d37d6f313000f5884 # v10.3.0
        with:
          # Same uv the release and the macOS installer require, so CI
          # exercises the toolchain that ships rather than the latest release.
          version: "0.10.2"

      - name: Set up Python
        run: uv python install 3.11

      - name: Install dependencies
        run: uv sync

      - name: Lint with ruff
        run: uv run ruff check src/ tests/

      - name: Type-check with pyright
        run: uv run pyright src/

      - name: Test with pytest
        run: uv run pytest tests/ -v --tb=short

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4

      - name: Build Docker image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: sensor
          push: false
          tags: squirrelops-sensor:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
