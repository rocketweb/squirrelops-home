name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  verify-release-version:
    name: Verify release version
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Require all release versions to match VERSION
        id: version
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          EXPECTED_TAG="v${VERSION}"
          PYPROJECT_VERSION="$(awk -F'"' '/^version = / { print $2; exit }' sensor/pyproject.toml)"
          INSTALL_VERSION="$(awk -F'"' '/^SQUIRRELOPS_VERSION=/ { print $2; exit }' scripts/install.sh)"

          [ "$GITHUB_REF_NAME" = "$EXPECTED_TAG" ] || {
            echo "Tag $GITHUB_REF_NAME does not match VERSION $VERSION" >&2
            exit 1
          }
          [ "$PYPROJECT_VERSION" = "$VERSION" ] || {
            echo "sensor/pyproject.toml version $PYPROJECT_VERSION does not match $VERSION" >&2
            exit 1
          }
          [ "$INSTALL_VERSION" = "$VERSION" ] || {
            echo "scripts/install.sh version $INSTALL_VERSION does not match $VERSION" >&2
            exit 1
          }
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

  # ---------------------------------------------------------------------------
  # Job 1: Build & push multi-arch Docker image to GHCR
  # ---------------------------------------------------------------------------
  build-docker:
    name: Build & Push Docker Image
    runs-on: ubuntu-latest
    needs: verify-release-version
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up QEMU
        uses: docker/setup-qemu-action@96fe6ef7f33517b61c61be40b68a1882f3264fb8 # v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@bb05f3f5519dd87d3ba754cc423b652a5edd6d2c # v4

      - name: Login to GitHub Container Registry
        uses: docker/login-action@af1e73f918a031802d376d3c8bbc3fe56130a9b0 # v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/squirrelops-sensor
          tags: |
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=raw,value=latest

      - name: Build and push
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7
        with:
          context: sensor
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ needs.verify-release-version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ---------------------------------------------------------------------------
  # Job 2: Build macOS .pkg installer
  # ---------------------------------------------------------------------------
  build-macos-pkg:
    name: Build macOS .pkg
    runs-on: macos-15
    needs: verify-release-version
    permissions:
      contents: read
    env:
      SQUIRRELOPS_RELEASE_BUILD: "1"
      HAS_CERTS: ${{ secrets.APPLE_CERTIFICATE_P12 != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
      HAS_NOTARY_CREDENTIALS: ${{ secrets.APPLE_ID != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_APP_PASSWORD != '' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Require release signing and notarization credentials
        run: |
          if [ "$HAS_CERTS" != "true" ]; then
            echo "Signing certificate secrets are required for release builds." >&2
            exit 1
          fi
          if [ "$HAS_NOTARY_CREDENTIALS" != "true" ]; then
            echo "Notarization secrets are required for release builds." >&2
            exit 1
          fi

      - name: Import signing certificates
        env:
          APPLE_CERTIFICATE_P12: ${{ secrets.APPLE_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          # Create a temporary keychain
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Import certificate
          CERT_PATH="$RUNNER_TEMP/certificate.p12"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"
          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$APPLE_CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/productsign

          # Allow codesign to use the keychain
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          # Add to search list
          security list-keychains -d user -s "$KEYCHAIN_PATH" login.keychain-db

          # Clean up cert file
          rm -f "$CERT_PATH"

      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.10.2"
          enable-cache: false

      - name: Build .pkg
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash scripts/build-pkg.sh

      - name: Verify signed and notarized installer
        run: |
          shopt -s nullglob
          PKG_FILES=(build/pkg/output/SquirrelOpsHome-*.pkg)
          if [ "${#PKG_FILES[@]}" -ne 1 ]; then
            echo "Expected exactly one release package; found ${#PKG_FILES[@]}." >&2
            exit 1
          fi

          BUILD_ARCH="$(uname -m)"
          APP_PATH="app/.build/${BUILD_ARCH}-apple-macosx/release/SquirrelOpsHome.app"
          PKG_PATH="${PKG_FILES[0]}"

          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          pkgutil --check-signature "$PKG_PATH"
          xcrun stapler validate "$PKG_PATH"
          spctl --assess --type install --verbose=2 "$PKG_PATH"

      - name: Upload .pkg artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-pkg
          path: build/pkg/output/SquirrelOpsHome-*
          if-no-files-found: error

  # ---------------------------------------------------------------------------
  # Job 3: Publish sensor wheel to PyPI
  # ---------------------------------------------------------------------------
  publish-sensor-wheel:
    name: Publish Sensor Wheel to PyPI
    runs-on: ubuntu-latest
    needs: verify-release-version
    permissions:
      contents: read
    continue-on-error: true
    env:
      PYPI_API_TOKEN: ${{ secrets.PYPI_API_TOKEN }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install build tooling
        run: pip install build

      - name: Build wheel
        run: python -m build sensor/

      - name: Publish to PyPI
        if: ${{ env.PYPI_API_TOKEN != '' }}
        uses: pypa/gh-action-pypi-publish@6733eb7d741f0b11ec6a39b58540dab7590f9b7d # v1.14.0
        with:
          password: ${{ env.PYPI_API_TOKEN }}
          packages-dir: sensor/dist/

      - name: Skip PyPI publish
        if: ${{ env.PYPI_API_TOKEN == '' }}
        run: echo "PYPI_API_TOKEN is not configured; skipping PyPI publish."

  # ---------------------------------------------------------------------------
  # Job 4: Create GitHub Release and update manifest
  # ---------------------------------------------------------------------------
  create-release:
    name: Create GitHub Release
    runs-on: ubuntu-latest
    needs: [verify-release-version, build-docker, build-macos-pkg]
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false

      - name: Download .pkg artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: macos-pkg
          path: release-assets/

      - name: Prepare release body
        id: body
        env:
          TAG_NAME: ${{ github.ref_name }}
        run: |
          VERSION="${TAG_NAME#v}"
          cp scripts/install.sh scripts/install-macos.sh release-assets/
          (cd release-assets && shasum -a 256 install.sh > install.sh.sha256)
          (cd release-assets && shasum -a 256 install-macos.sh > install-macos.sh.sha256)
          : > release-body.md
          if [ -f "docs/releases/${VERSION}.md" ]; then
            cat "docs/releases/${VERSION}.md" >> release-body.md
            printf '\n' >> release-body.md
          fi
          cat >> release-body.md << 'RELEASE_EOF'
          ## Install

          ### macOS (recommended)

          **[Download SquirrelOpsHome-VERSION.pkg](PLACEHOLDER)** - open the installer and follow the prompts.

          The signed and notarized installer is verified by macOS Gatekeeper before publication. It sets up the app and network sensor in one step. No terminal required.

          After installing, open **SquirrelOps Home** from your Applications folder and follow the on-screen pairing flow.

          ### Linux / NAS (Docker)

          Installs the **sensor only** on Linux/NAS. The dashboard/control-plane app is macOS-only and must be installed separately on a Mac.

          Download `install.sh` and `install.sh.sha256` from this release, then verify before running:

          ```bash
          shasum -a 256 -c install.sh.sha256
          less install.sh
          sudo bash install.sh
          ```

          After the sensor is running, install the macOS app separately to pair with it and use the dashboard.

          ### Uninstall

          ```bash
          sudo bash /Library/SquirrelOps/uninstall.sh
          ```

          ---
          RELEASE_EOF

          # Fix version placeholder
          sed -i "s/VERSION/${VERSION}/g" release-body.md
          # Fix download URL
          PKG_FILE=$(ls release-assets/SquirrelOpsHome-*.pkg 2>/dev/null | grep -v '.sha256' | head -1)
          PKG_BASENAME=$(basename "$PKG_FILE")
          DOWNLOAD_URL="https://github.com/${{ github.repository }}/releases/download/${TAG_NAME}/${PKG_BASENAME}"
          sed -i "s|PLACEHOLDER|${DOWNLOAD_URL}|g" release-body.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@c12583777ecdfd3be55c69cf75464299dc01057e # v3
        with:
          body_path: release-body.md
          files: |
            release-assets/SquirrelOpsHome-*.pkg
            release-assets/SquirrelOpsHome-*.pkg.sha256
            release-assets/install.sh
            release-assets/install.sh.sha256
            release-assets/install-macos.sh
            release-assets/install-macos.sh.sha256

      - name: Update manifest.json
        env:
          TAG_NAME: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        run: |
          VERSION="${TAG_NAME#v}"
          PKG_FILE=$(ls release-assets/SquirrelOpsHome-*.pkg 2>/dev/null | grep -v '.sha256' | head -1)
          PKG_SHA256=""
          if [ -f "${PKG_FILE}.sha256" ]; then
            PKG_SHA256=$(awk '{print $1}' "${PKG_FILE}.sha256")
          fi

          DOWNLOAD_BASE="https://github.com/${REPO}/releases/download/${TAG_NAME}"
          PKG_BASENAME=$(basename "$PKG_FILE")
          PKG_URL="${DOWNLOAD_BASE}/${PKG_BASENAME}"
          DOCKER_IMAGE="ghcr.io/${REPO%%/*}/squirrelops-sensor:${VERSION}"
          UPDATED_AT="$(date -u +'%Y-%m-%dT%H:%M:%SZ')"

          # Update manifest using jq
          jq \
            --arg version "$VERSION" \
            --arg pkg_url "$PKG_URL" \
            --arg pkg_sha "${PKG_SHA256}" \
            --arg docker_image "$DOCKER_IMAGE" \
            --arg release_url "https://github.com/${REPO}/releases/tag/${TAG_NAME}" \
            --arg updated_at "$UPDATED_AT" \
            '.latest.sensor = $version |
             .latest.app = $version |
             .downloads.macos_pkg = $pkg_url |
             .downloads.macos_pkg_sha256 = $pkg_sha |
             .downloads.docker_image = $docker_image |
             .updated_at = $updated_at |
             .sensor.latest_version = $version |
             .app.latest_version = $version |
             .app.download_url = $pkg_url |
             .app.release_notes_url = $release_url |
             .sensor.release_notes_url = $release_url |
             .app.sha256 = $pkg_sha' \
            site/public/manifest.json > site/public/manifest.json.tmp

          mv site/public/manifest.json.tmp site/public/manifest.json

          echo "Updated manifest.json:"
          cat site/public/manifest.json

      - name: Commit and push manifest
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add site/public/manifest.json
          git commit -m "chore: update manifest.json for ${GITHUB_REF_NAME}"
          git -c credential.helper='!f() { echo username=x-access-token; echo "password=$GH_TOKEN"; }; f' \
            push origin HEAD:main
