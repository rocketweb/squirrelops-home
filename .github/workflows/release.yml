name: Release Home Distribution

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing protected Home tag (for example, home-v2.0.0)
        required: true
        type: string
      commit_sha:
        description: Full commit SHA expected for the tag and protected main
        required: true
        type: string

concurrency:
  group: squirrelops-home-production-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify-release:
    name: Verify protected Home release inputs
    runs-on: ubuntu-latest
    environment: release
    permissions:
      actions: read
      contents: read
    outputs:
      distribution_version: ${{ steps.release.outputs.distribution_version }}
      app_version: ${{ steps.release.outputs.app_version }}
      sensor_version: ${{ steps.release.outputs.sensor_version }}
      tag: ${{ steps.release.outputs.tag }}
      commit_sha: ${{ steps.release.outputs.commit_sha }}
    steps:
      - name: Checkout dispatched commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Require exact protected refs and independent versions
        id: release
        env:
          EXPECTED_COMMIT: ${{ inputs.commit_sha }}
          RELEASE_TAG: ${{ inputs.tag }}
          RUN_COMMIT: ${{ github.sha }}
        run: |
          set -euo pipefail
          [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]
          [ "$GITHUB_RUN_ATTEMPT" = "1" ]
          [ "$GITHUB_REF" = "refs/heads/main" ]
          [[ "$EXPECTED_COMMIT" =~ ^[0-9a-f]{40}$ ]]
          [[ "$RELEASE_TAG" =~ ^home-v[0-9]+\.[0-9]+\.[0-9]+$ ]]
          [ "$RUN_COMMIT" = "$EXPECTED_COMMIT" ]

          git fetch --no-tags --force origin \
            refs/heads/main:refs/remotes/origin/main
          [ "$RUN_COMMIT" = "$(git rev-parse refs/remotes/origin/main)" ]
          git ls-remote --exit-code --refs origin \
            "refs/tags/${RELEASE_TAG}" >/dev/null
          git fetch --no-tags --force origin \
            "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          [ "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$RUN_COMMIT" ]

          DISTRIBUTION_VERSION="$(tr -d '[:space:]' < VERSION)"
          APP_VERSION_VALUE="$(tr -d '[:space:]' < APP_VERSION)"
          SENSOR_VERSION="$(
            awk -F'"' '/^version = / { print $2; exit }' sensor/pyproject.toml
          )"
          INSTALL_SENSOR_VERSION="$(
            awk -F'"' '/^SQUIRRELOPS_SENSOR_VERSION=/ { print $2; exit }' \
              scripts/install.sh
          )"
          [ "$RELEASE_TAG" = "home-v${DISTRIBUTION_VERSION}" ]
          [ "$INSTALL_SENSOR_VERSION" = "$SENSOR_VERSION" ]
          [ -f "docs/releases/${DISTRIBUTION_VERSION}.md" ]

          APP_TAG="app-v${APP_VERSION_VALUE}"
          git ls-remote --exit-code --refs origin \
            "refs/tags/${APP_TAG}" >/dev/null || {
              echo "The embedded app must have an existing independent component tag." >&2
              exit 1
            }
          git fetch --no-tags --force origin \
            "+refs/tags/${APP_TAG}:refs/tags/${APP_TAG}"
          git diff --quiet "$APP_TAG" "$RELEASE_TAG" -- \
            APP_VERSION \
            app/Package.swift \
            app/Package.resolved \
            app/Sources \
            app/build-app.sh || {
              echo "Current app source differs from ${APP_TAG}; bump and tag the app first." >&2
              exit 1
            }

          SENSOR_TAG="sensor-v${SENSOR_VERSION}"
          git ls-remote --exit-code --refs origin \
            "refs/tags/${SENSOR_TAG}" >/dev/null || {
              echo "The embedded sensor must have an existing independent release tag." >&2
              exit 1
            }
          git fetch --no-tags --force origin \
            "+refs/tags/${SENSOR_TAG}:refs/tags/${SENSOR_TAG}"
          git diff --quiet "$SENSOR_TAG" "$RELEASE_TAG" -- \
            sensor/Dockerfile \
            sensor/config \
            sensor/pyproject.toml \
            sensor/resources \
            sensor/signatures \
            sensor/src \
            sensor/uv.lock \
            scripts/build-sensor-venv.sh \
            scripts/sanitize-python-runtime.sh || {
            echo "Current sensor source differs from ${SENSOR_TAG}; bump and release the sensor first." >&2
            exit 1
          }

          {
            echo "distribution_version=$DISTRIBUTION_VERSION"
            echo "app_version=$APP_VERSION_VALUE"
            echo "sensor_version=$SENSOR_VERSION"
            echo "tag=$RELEASE_TAG"
            echo "commit_sha=$RUN_COMMIT"
          } >> "$GITHUB_OUTPUT"

      - name: Mint narrow release-policy token
        id: release-policy-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_POLICY_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_POLICY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: read
          permission-administration: read
          permission-contents: read

      - name: Require remote release protections
        env:
          GH_TOKEN: ${{ steps.release-policy-token.outputs.token }}
          REPOSITORY: ${{ github.repository }}
          RELEASE_TAG: ${{ inputs.tag }}
          APP_TAG: app-v${{ steps.release.outputs.app_version }}
          SENSOR_TAG: sensor-v${{ steps.release.outputs.sensor_version }}
        run: |
          set -euo pipefail
          for TAG in "$RELEASE_TAG" "$APP_TAG" "$SENSOR_TAG"; do
            bash scripts/check-release-controls.sh \
              "$REPOSITORY" "$TAG" .github/release-policy.json \
              "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_ACTOR_ID"
          done

  build-macos-pkg:
    name: Build signed and notarized macOS package
    runs-on: macos-15
    needs: verify-release
    environment: release
    permissions:
      actions: read
      contents: read
    env:
      SQUIRRELOPS_RELEASE_BUILD: "1"
      SQUIRRELOPS_DISTRIBUTION_VERSION: ${{ needs.verify-release.outputs.distribution_version }}
      SQUIRRELOPS_APP_VERSION: ${{ needs.verify-release.outputs.app_version }}
      SQUIRRELOPS_SENSOR_VERSION: ${{ needs.verify-release.outputs.sensor_version }}
      HAS_CERTS: ${{ secrets.APPLE_APPLICATION_CERTIFICATE_P12 != '' && secrets.APPLE_INSTALLER_CERTIFICATE_P12 != '' && secrets.APPLE_CERTIFICATE_PASSWORD != '' }}
      HAS_NOTARY_CREDENTIALS: ${{ secrets.APPLE_ID != '' && secrets.APPLE_TEAM_ID != '' && secrets.APPLE_APP_PASSWORD != '' }}
    steps:
      - name: Checkout immutable release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.verify-release.outputs.commit_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Require release signing and notarization credentials
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          set -euo pipefail
          [ "$HAS_CERTS" = "true" ] || {
            echo "Signing certificate secrets are required for release builds." >&2
            exit 1
          }
          [ "$HAS_NOTARY_CREDENTIALS" = "true" ] || {
            echo "Notarization secrets are required for release builds." >&2
            exit 1
          }
          [ "$APPLE_TEAM_ID" = "PSQ5HK5U65" ]

      - name: Import signing certificates
        env:
          APPLE_APPLICATION_CERTIFICATE_P12: ${{ secrets.APPLE_APPLICATION_CERTIFICATE_P12 }}
          APPLE_INSTALLER_CERTIFICATE_P12: ${{ secrets.APPLE_INSTALLER_CERTIFICATE_P12 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
        run: |
          set -euo pipefail
          umask 077
          KEYCHAIN_PATH="$RUNNER_TEMP/build.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 32)"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"

          cleanup_signing_material() {
            rm -f \
              "$RUNNER_TEMP/application-certificate.p12" \
              "$RUNNER_TEMP/application-certificate.pem" \
              "$RUNNER_TEMP/application-key.pem" \
              "$RUNNER_TEMP/installer-certificate.p12" \
              "$RUNNER_TEMP/installer-certificate.pem" \
              "$RUNNER_TEMP/installer-key.pem"
          }
          trap cleanup_signing_material EXIT

          import_identity() {
            local encoded_bundle="$1"
            local prefix="$2"
            local expected_subject="$3"
            local trusted_tool="$4"
            local bundle_path="$RUNNER_TEMP/${prefix}-certificate.p12"
            local certificate_path="$RUNNER_TEMP/${prefix}-certificate.pem"
            local key_path="$RUNNER_TEMP/${prefix}-key.pem"
            local bundle_info
            local actual_subject
            local certificate_key_hash
            local private_key_hash

            printf '%s' "$encoded_bundle" \
              | base64 --decode > "$bundle_path"
            bundle_info="$(
              openssl pkcs12 \
                -in "$bundle_path" \
                -info \
                -noout \
                -passin env:APPLE_CERTIFICATE_PASSWORD 2>&1
            )"
            printf '%s\n' "$bundle_info" | grep -Fqi "AES-256-CBC"
            printf '%s\n' "$bundle_info" | grep -Fqi "MAC: sha256"
            if printf '%s\n' "$bundle_info" | grep -Fqi "RC2"; then
              echo "Legacy RC2 PKCS#12 bundles are forbidden." >&2
              exit 1
            fi

            openssl pkcs12 \
              -in "$bundle_path" \
              -clcerts \
              -nokeys \
              -passin env:APPLE_CERTIFICATE_PASSWORD \
              -out "$certificate_path"
            openssl pkcs12 \
              -in "$bundle_path" \
              -nocerts \
              -nodes \
              -passin env:APPLE_CERTIFICATE_PASSWORD \
              -out "$key_path"

            actual_subject="$(
              openssl x509 -in "$certificate_path" -noout -subject
            )"
            case "$actual_subject" in
              *"$expected_subject"*) ;;
              *)
                echo "Unexpected Apple signing certificate: $actual_subject" >&2
                exit 1
                ;;
            esac

            certificate_key_hash="$(
              openssl x509 \
                -in "$certificate_path" \
                -pubkey \
                -noout \
                | openssl pkey -pubin -outform DER 2>/dev/null \
                | shasum -a 256 \
                | awk '{print $1}'
            )"
            private_key_hash="$(
              openssl pkey \
                -in "$key_path" \
                -pubout \
                -outform DER 2>/dev/null \
                | shasum -a 256 \
                | awk '{print $1}'
            )"
            [ "$certificate_key_hash" = "$private_key_hash" ]

            security import "$certificate_path" -k "$KEYCHAIN_PATH"
            security import "$key_path" -k "$KEYCHAIN_PATH" -T "$trusted_tool"
          }

          import_identity \
            "$APPLE_APPLICATION_CERTIFICATE_P12" \
            application \
            "Developer ID Application: Rocket Web Inc (PSQ5HK5U65)" \
            /usr/bin/codesign
          import_identity \
            "$APPLE_INSTALLER_CERTIFICATE_P12" \
            installer \
            "Developer ID Installer: Rocket Web Inc (PSQ5HK5U65)" \
            /usr/bin/productsign

          security set-key-partition-list -S apple-tool:,apple: -s \
            -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s \
            "$KEYCHAIN_PATH" login.keychain-db
          cleanup_signing_material
          trap - EXIT

      - name: Select Xcode 16.2
        run: sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer

      - name: Set up Python 3.11
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.11"

      - name: Install pinned uv
        uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b # v8.1.0
        with:
          version: "0.10.2"
          enable-cache: false

      - name: Build .pkg
        env:
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          APPLE_APP_PASSWORD: ${{ secrets.APPLE_APP_PASSWORD }}
        run: bash scripts/build-pkg.sh

      - name: Verify signed and notarized installer
        run: |
          set -euo pipefail
          PKG="build/pkg/output/SquirrelOpsHome-${SQUIRRELOPS_DISTRIBUTION_VERSION}.pkg"
          codesign --verify --deep --strict --verbose=2 \
            "app/.build/$(uname -m)-apple-macosx/release/SquirrelOpsHome.app"
          pkgutil --check-signature "$PKG"
          xcrun stapler validate "$PKG"
          spctl --assess --type install --verbose=2 "$PKG"

      - name: Upload .pkg artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: macos-pkg
          path: build/pkg/output/SquirrelOpsHome-*.pkg
          if-no-files-found: error
          retention-days: 1

      - name: Remove temporary signing keychain
        if: always()
        run: |
          security delete-keychain "$RUNNER_TEMP/build.keychain-db" 2>/dev/null || true
          rm -f \
            "$RUNNER_TEMP/application-certificate.p12" \
            "$RUNNER_TEMP/application-certificate.pem" \
            "$RUNNER_TEMP/application-key.pem" \
            "$RUNNER_TEMP/installer-certificate.p12" \
            "$RUNNER_TEMP/installer-certificate.pem" \
            "$RUNNER_TEMP/installer-key.pem"

  publish-release:
    name: Publish immutable Home release
    runs-on: ubuntu-latest
    needs:
      - verify-release
      - build-macos-pkg
    environment: release
    permissions:
      actions: read
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    env:
      RELEASE_TAG: ${{ needs.verify-release.outputs.tag }}
      RELEASE_VERSION: ${{ needs.verify-release.outputs.distribution_version }}
      RELEASE_COMMIT: ${{ needs.verify-release.outputs.commit_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout immutable release commit
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          ref: ${{ needs.verify-release.outputs.commit_sha }}
          fetch-depth: 1
          persist-credentials: false

      - name: Download .pkg artifact
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: macos-pkg
          path: release-input

      - name: Recheck tag and prepare checksummed assets
        run: |
          set -euo pipefail
          git fetch --no-tags --force origin \
            refs/heads/main:refs/remotes/origin/main
          git fetch --no-tags --force origin \
            "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          [ "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$RELEASE_COMMIT" ]
          git merge-base --is-ancestor \
            "$RELEASE_COMMIT" refs/remotes/origin/main
          ! gh release view "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1
          python3 scripts/prepare-release-assets.py \
            --package "release-input/SquirrelOpsHome-${RELEASE_VERSION}.pkg" \
            --tag "$RELEASE_TAG" \
            --commit "$RELEASE_COMMIT" \
            --repository "$GITHUB_REPOSITORY" \
            --output release-assets
          (cd release-assets && shasum -a 256 -c SHA256SUMS)

      - name: Create draft release
        run: |
          set -euo pipefail
          printf '%s\n' \
            "Canonical notes and verification instructions are in the attested RELEASE-VERIFICATION.md asset." \
            > release-body.md
          gh release create "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" \
            --verify-tag \
            --target "$RELEASE_COMMIT" \
            --draft \
            --title "SquirrelOps Home ${RELEASE_VERSION}" \
            --notes-file release-body.md
          gh release upload "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" release-assets/*

      - name: Attest release assets
        uses: actions/attest@f7c74d28b9d84cb8768d0b8ca14a4bac6ef463e6 # v4.2.0
        with:
          subject-path: |
            release-assets/SquirrelOpsHome-*.pkg
            release-assets/SquirrelOpsHome-*.pkg.sha256
            release-assets/squirrelops-home.rb
            release-assets/SHA256SUMS
            release-assets/release-metadata.json
            release-assets/RELEASE-VERIFICATION.md

      - name: Verify draft
        run: |
          bash scripts/verify-github-release.sh \
            "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$RELEASE_COMMIT" \
            release-assets draft

      - name: Mint final-gate token
        id: release-policy-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          client-id: ${{ secrets.RELEASE_POLICY_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_POLICY_APP_PRIVATE_KEY }}
          owner: ${{ github.repository_owner }}
          repositories: ${{ github.event.repository.name }}
          permission-actions: read
          permission-administration: read
          permission-contents: read

      - name: Publish immutable release last
        env:
          RELEASE_POLICY_TOKEN: ${{ steps.release-policy-token.outputs.token }}
        run: |
          set -euo pipefail
          GH_TOKEN="$RELEASE_POLICY_TOKEN" \
            bash scripts/check-release-controls.sh \
              "$GITHUB_REPOSITORY" "$RELEASE_TAG" .github/release-policy.json \
              "$GITHUB_RUN_ID" "$GITHUB_RUN_ATTEMPT" "$GITHUB_ACTOR_ID"
          git fetch --no-tags --force origin \
            "+refs/tags/${RELEASE_TAG}:refs/tags/${RELEASE_TAG}"
          [ "$(git rev-parse "${RELEASE_TAG}^{commit}")" = "$RELEASE_COMMIT" ]
          bash scripts/verify-github-release.sh \
            "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$RELEASE_COMMIT" \
            release-assets draft
          gh release edit "$RELEASE_TAG" \
            --repo "$GITHUB_REPOSITORY" --draft=false --latest

          VERIFIED=0
          for ATTEMPT in 1 2 3 4 5 6; do
            if bash scripts/verify-github-release.sh \
              "$GITHUB_REPOSITORY" "$RELEASE_TAG" "$RELEASE_COMMIT" \
              release-assets immutable \
              && gh release verify "$RELEASE_TAG" \
                --repo "$GITHUB_REPOSITORY"
            then
              VERIFIED=1
              break
            fi
            sleep 5
          done
          [ "$VERIFIED" -eq 1 ]
