[global]
    workgroup = HAWTHORN
    netbios name = STUDIO-MINI
    server string = Studio Build Mac
    security = user
    map to guest = Never
    interfaces = lo
    bind interfaces only = yes
    smb ports = 445
    server min protocol = SMB2_10
    server max protocol = SMB3
    ea support = yes
    vfs objects = catia fruit streams_xattr
    fruit:aapl = yes
    fruit:metadata = stream
    fruit:resource = file
    fruit:model = MacSamba
    fruit:posix_rename = yes
    fruit:veto_appledouble = no
    fruit:wipe_intentionally_left_blank_rfork = yes
    fruit:delete_empty_adfiles = yes
    fruit:copyfile = yes
    load printers = no
    printing = bsd
    disable spoolss = yes
    log file = /var/log/samba/log.%m
    max log size = 1000
    log level = 2 auth:3

[Builds]
    path = /Users/buildbot/Builds
    valid users = buildbot
    read only = no
    browseable = yes
    create mask = 0644
    directory mask = 0755

[Engineering]
    path = /Users/buildbot/Projects
    valid users = buildbot
    read only = no
    browseable = yes
    create mask = 0644
    directory mask = 0755

[Time Machine Backups]
    path = /Users/buildbot/Library/Time Machine Backups
    valid users = buildbot
    read only = no
    browseable = yes
    vfs objects = catia fruit streams_xattr
    fruit:time machine = yes
    fruit:time machine max size = 500G
    create mask = 0600
    directory mask = 0700
